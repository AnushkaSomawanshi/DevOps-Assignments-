apiVersion: v1
kind: Pod
metadata:
  name: gynecare-backend-pod
  namespace: gynecare-dev
  labels:
    app: gynecare-backend
    tier: api
spec:
  containers:
    - name: backend-container
      image: gynecare-backend:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5000
          name: http-api
      env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "development"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
