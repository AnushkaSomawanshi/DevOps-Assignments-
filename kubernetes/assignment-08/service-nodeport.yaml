apiVersion: v1
kind: Service
metadata:
  name: gynecare-backend-nodeport
  namespace: gynecare-dev
  labels:
    app: gynecare-backend
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: http-api
      nodePort: 30500
      protocol: TCP
      name: http-api
  selector:
    app: gynecare-backend
    tier: api
