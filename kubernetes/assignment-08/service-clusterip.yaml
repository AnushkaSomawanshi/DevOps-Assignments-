apiVersion: v1
kind: Service
metadata:
  name: gynecare-backend-clusterip
  namespace: gynecare-dev
  labels:
    app: gynecare-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: http-api
      protocol: TCP
      name: http-api
  selector:
    app: gynecare-backend
    tier: api
