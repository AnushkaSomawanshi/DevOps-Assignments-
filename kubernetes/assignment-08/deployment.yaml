apiVersion: apps/v1
kind: Deployment
metadata:
  name: gynecare-backend-deployment
  namespace: gynecare-dev
  labels:
    app: gynecare-backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gynecare-backend
      tier: api
  template:
    metadata:
      labels:
        app: gynecare-backend
        tier: api
    spec:
      containers:
        - name: backend-container
          image: gynecare-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http-api
          envFrom:
            - configMapRef:
                name: gynecare-app-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
